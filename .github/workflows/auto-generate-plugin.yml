name: Auto-Generate Proto Plugin

on:
  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repository (owner/repo format, e.g., "terrastruct/d2")
        required: true
        type: string
      plugin_name:
        description: Plugin name (optional, will auto-detect if not provided)
        required: false
        type: string
      create_pr:
        description: Create pull request with generated plugin
        required: false
        default: true
        type: boolean
      test_plugin:
        description: Test the generated plugin before creating PR
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  NODE_VERSION: 24.1.0

jobs:
  validate-input:
    name: Validate Input
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.parse.outputs.owner }}
      repo: ${{ steps.parse.outputs.repo }}
      plugin_name: ${{ steps.parse.outputs.plugin_name }}
      branch_name: ${{ steps.parse.outputs.branch_name }}
      github_url: ${{ steps.parse.outputs.github_url }}
    steps:
      - name: Parse repository input
        id: parse
        run: |
          repository="${{ inputs.repository }}"
          
          if [[ ! "$repository" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]; then
            echo "❌ Invalid repository format. Expected: owner/repo"
            exit 1
          fi
          
          owner=$(echo "$repository" | cut -d'/' -f1)
          repo=$(echo "$repository" | cut -d'/' -f2)
          
          plugin_name="${{ inputs.plugin_name }}"
          if [ -z "$plugin_name" ]; then
            plugin_name="$repo"
          fi
          
          branch_name="feat/add-${plugin_name}-plugin"
          github_url="https://github.com/${repository}"
          
          echo "owner=$owner" >> $GITHUB_OUTPUT
          echo "repo=$repo" >> $GITHUB_OUTPUT
          echo "plugin_name=$plugin_name" >> $GITHUB_OUTPUT
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "github_url=$github_url" >> $GITHUB_OUTPUT
          
          echo "✅ Repository: $repository"
          echo "✅ Plugin Name: $plugin_name"
          echo "✅ Branch Name: $branch_name"

  generate-plugin:
    name: Generate Plugin Configuration
    runs-on: ubuntu-latest
    needs: validate-input
    outputs:
      plugin_file: ${{ steps.generate.outputs.plugin_file }}
      generation_success: ${{ steps.generate.outputs.success }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup toolchain with proto
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate plugin configuration
        id: generate
        run: |
          echo "🔧 Generating plugin configuration for ${{ needs.validate-input.outputs.github_url }}"
          
          plugin_name="${{ needs.validate-input.outputs.plugin_name }}"
          output_file="plugins/${plugin_name}.json"
          
          mkdir -p plugins
          
          if pnpm run generate:auto -- --output "$output_file" "${{ needs.validate-input.outputs.github_url }}"; then
            echo "✅ Plugin generation successful!"
            echo "success=true" >> $GITHUB_OUTPUT
            echo "plugin_file=$output_file" >> $GITHUB_OUTPUT
            
            if [ -f "$output_file" ]; then
              echo "📄 Generated plugin configuration:"
              cat "$output_file"
            else
              echo "❌ Plugin file was not created: $output_file"
              echo "success=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "❌ Plugin generation failed"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Validate generated plugin
        if: steps.generate.outputs.success == 'true'
        run: |
          plugin_file="${{ steps.generate.outputs.plugin_file }}"
          
          echo "🔍 Validating generated plugin configuration..."
          
          if [ ! -f "$plugin_file" ]; then
            echo "❌ Plugin file not found: $plugin_file"
            exit 1
          fi
          
          if ! jq empty "$plugin_file" 2>/dev/null; then
            echo "❌ Plugin file is not valid JSON"
            exit 1
          fi
          
          required_fields=("name" "type" "platform" "install" "resolve")
          for field in "${required_fields[@]}"; do
            if ! jq -e ".$field" "$plugin_file" >/dev/null; then
              echo "❌ Missing required field: $field"
              exit 1
            fi
          done
          
          echo "✅ Plugin configuration is valid!"

      - name: Upload generated plugin as artifact
        if: steps.generate.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-plugin
          path: ${{ steps.generate.outputs.plugin_file }}
          retention-days: 30

  test-plugin:
    name: Test Generated Plugin
    runs-on: ${{ matrix.os }}
    needs: [validate-input, generate-plugin]
    if: inputs.test_plugin && needs.generate-plugin.outputs.generation_success == 'true'
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup toolchain with proto
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download generated plugin
        uses: actions/download-artifact@v4
        with:
          name: generated-plugin
          path: plugins/

      - name: Test plugin installation
        run: |
          plugin_file="${{ needs.generate-plugin.outputs.plugin_file }}"
          
          echo "🧪 Testing plugin: $plugin_file on ${{ matrix.os }} (${{ matrix.arch }})"
          
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pnpm run test-plugin-with-proto -- "$plugin_file"
          else
            timeout 300s pnpm run test-plugin-with-proto -- "$plugin_file"
          fi

  create-pull-request:
    name: Create Pull Request
    runs-on: ubuntu-latest
    needs: [validate-input, generate-plugin, test-plugin]
    if: |
      always() && 
      inputs.create_pr && 
      needs.generate-plugin.outputs.generation_success == 'true' &&
      (needs.test-plugin.result == 'success' || needs.test-plugin.result == 'skipped')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download generated plugin
        uses: actions/download-artifact@v4
        with:
          name: generated-plugin
          path: plugins/

      - name: Create branch and commit changes
        run: |
          branch_name="${{ needs.validate-input.outputs.branch_name }}"
          plugin_file="${{ needs.generate-plugin.outputs.plugin_file }}"
          plugin_name="${{ needs.validate-input.outputs.plugin_name }}"
          repository="${{ inputs.repository }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout -b "$branch_name"
          git add "$plugin_file"
          
          git commit -m "feat: add ${plugin_name} proto plugin

          Auto-generated plugin configuration for ${repository}
          
          Generated from: https://github.com/${repository}
          Plugin file: ${plugin_file}
          
          This plugin was automatically generated using the proto-plugins auto-generation workflow."
          
          git push origin "$branch_name"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          plugin_name="${{ needs.validate-input.outputs.plugin_name }}"
          repository="${{ inputs.repository }}"
          plugin_file="${{ needs.generate-plugin.outputs.plugin_file }}"
          branch_name="${{ needs.validate-input.outputs.branch_name }}"
          
          gh pr create \
            --title "feat: add ${plugin_name} proto plugin" \
            --body "## 🤖 Auto-Generated Proto Plugin

          This PR adds a new proto plugin configuration for **${plugin_name}** from [\`${repository}\`](https://github.com/${repository}).

          ### 📋 Plugin Details
          - **Repository**: ${repository}
          - **Plugin Name**: ${plugin_name}
          - **Plugin File**: \`${plugin_file}\`

          ### 🧪 Testing Status
          ${{ inputs.test_plugin && '✅ Plugin has been tested on multiple platforms' || '⚠️ Plugin testing was skipped' }}

          ### 🚀 Next Steps
          1. Review the generated configuration
          2. Test the plugin locally if needed: \`pnpm run test-plugin-with-proto -- ${plugin_file}\`
          3. Merge if everything looks good!

          ---
          *This PR was automatically created by the Auto-Generate Proto Plugin workflow.*" \
            --head "$branch_name" \
            --base main \
            --label "auto-generated,plugin,enhancement"
