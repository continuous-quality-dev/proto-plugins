name: Lint and Analyze

on:
  pull_request:
    branches:
      - main
    paths:
      - src/**/*.ts
      - scripts/**/*.js
      - "*.ts"
      - "*.js"
      - .trunk/trunk.yaml
      - .github/workflows/lint-and-analyze.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  lint-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
        with:
          check-mode: all
          post-annotations: true
          arguments: --ci

      - name: Get changed files
        id: changed-files
        run: |
          # Get list of changed TypeScript and JavaScript files
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD | grep -E '\.(ts|js)$' | tr '\n' ' ')
          echo "changed-files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED_FILES"

      - name: Generate base complexity metrics
        run: |
          # Checkout base branch to generate baseline metrics
          git checkout ${{ github.event.pull_request.base.sha }}
          npm ci
          npm run complexity-metrics
          cp complexity-metrics.json base-complexity-metrics.json
          
          # Return to PR branch
          git checkout ${{ github.event.pull_request.head.sha }}
          npm ci

      - name: Generate current complexity metrics
        run: |
          npm run complexity-metrics
          cp complexity-metrics.json current-complexity-metrics.json

      - name: Generate complexity comparison
        run: |
          npm run generate-complexity-comparison
        env:
          BASE_METRICS_FILE: base-complexity-metrics.json
          CURRENT_METRICS_FILE: current-complexity-metrics.json
          CHANGED_FILES: ${{ steps.changed-files.outputs.changed-files }}

      - name: Generate diagrams for changed files
        run: |
          npm run generate-diagrams-changed
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.changed-files }}

      - name: Upload complexity metrics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: complexity-metrics
          path: |
            base-complexity-metrics.json
            current-complexity-metrics.json
            complexity-comparison.md
          retention-days: 30

      - name: Upload generated diagrams
        uses: actions/upload-artifact@v4
        with:
          name: generated-diagrams
          path: |
            CODEBASE_DIAGRAM.md
            changed-files-diagrams.md
          retention-days: 30

      - name: Comment PR with analysis
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🔍 Code Analysis Results\n\n';
            
            // Add complexity comparison if available
            if (fs.existsSync('complexity-comparison.md')) {
              const complexityComparison = fs.readFileSync('complexity-comparison.md', 'utf8');
              comment += complexityComparison + '\n\n';
            }
            
            // Add diagrams for changed files if available
            if (fs.existsSync('changed-files-diagrams.md')) {
              const diagramsContent = fs.readFileSync('changed-files-diagrams.md', 'utf8');
              comment += '## 📊 Updated Diagrams\n\n';
              comment += diagramsContent + '\n\n';
            }
            
            // Add links to artifacts
            comment += '## 📁 Artifacts\n\n';
            comment += '- [Complexity Metrics](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
            comment += '- [Generated Diagrams](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n';
            
            comment += '---\n*Generated by lint-and-analyze workflow*';
            
            // Find existing comment to update or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.body.includes('🔍 Code Analysis Results')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
