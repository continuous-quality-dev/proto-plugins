name: Test Single Proto Plugin

on:
  workflow_dispatch:
    inputs:
      plugin_file:
        description: 'Plugin file to test (e.g., "plugins/d2.json")'
        required: true
        type: string
      test_os:
        description: "Operating systems to test on"
        required: false
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - all
      specific_version:
        description: "Specific version to test (optional)"
        required: false
        type: string
  workflow_call:
    inputs:
      plugin_file:
        description: 'Plugin file to test (e.g., "plugins/d2.json")'
        required: true
        type: string
      test_os:
        description: "Operating systems to test on"
        required: false
        type: string
        default: "ubuntu-latest"
      specific_version:
        description: "Specific version to test (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: "22.6.0"

jobs:
  setup:
    name: Setup Test Matrix
    runs-on: ubuntu-latest
    outputs:
      os-matrix: ${{ steps.setup-matrix.outputs.os-matrix }}
      plugin-exists: ${{ steps.check-plugin.outputs.exists }}
      plugin-name: ${{ steps.check-plugin.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if plugin file exists
        id: check-plugin
        run: |
          plugin_file="${{ inputs.plugin_file }}"

          if [ ! -f "$plugin_file" ]; then
            echo "❌ Plugin file not found: $plugin_file"
            echo "Available plugins:"
            find proto -name "*.json" -type f | sort
            exit 1
          fi

          plugin_name=$(basename "$plugin_file" .json | sed 's/-auto$//')
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "name=$plugin_name" >> $GITHUB_OUTPUT
          echo "✅ Plugin file found: $plugin_file"
          echo "Plugin name: $plugin_name"

      - name: Setup OS matrix
        id: setup-matrix
        run: |
          if [ "${{ inputs.test_os }}" = "all" ]; then
            os_matrix='["ubuntu-latest", "macos-latest", "windows-latest"]'
          else
            os_matrix='["${{ inputs.test_os }}"]'
          fi
          echo "os-matrix=$os_matrix" >> $GITHUB_OUTPUT
          echo "Testing on: $os_matrix"

  test-plugin:
    name: Test ${{ needs.setup.outputs.plugin-name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: setup
    if: needs.setup.outputs.plugin-exists == 'true'

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.setup.outputs.os-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Verify Proto installation
        run: |
          proto --version
          echo "Proto installed successfully"

      - name: Test plugin
        shell: bash
        run: |
          plugin_file="${{ inputs.plugin_file }}"
          plugin_name="${{ needs.setup.outputs.plugin-name }}"
          specific_version="${{ inputs.specific_version }}"

          echo "🧪 Testing plugin: $plugin_name"
          echo "📁 Plugin file: $plugin_file"
          echo "💻 Operating system: ${{ runner.os }}"
          echo "🏃 Runner: ${{ matrix.os }}"

          if [ -n "$specific_version" ]; then
            echo "🔖 Testing specific version: $specific_version"
            npm run test-plugin-with-proto -- --version "$specific_version" "$plugin_file"
          else
            echo "🔖 Testing latest version"
            npm run test-plugin-with-proto -- "$plugin_file"
          fi

          echo "✅ Plugin test completed successfully!"

      - name: Test plugin integration
        shell: bash
        run: |
          plugin_name="${{ needs.setup.outputs.plugin-name }}"
          plugin_file="${{ inputs.plugin_file }}"

          echo "🔗 Testing plugin integration with proto..."

          # Copy plugin to proto plugins directory
          mkdir -p ~/.proto/plugins
          cp "$plugin_file" ~/.proto/plugins/${plugin_name}.json

          echo "Plugin installed to: ~/.proto/plugins/${plugin_name}.json"

          # Test if proto recognizes the plugin
          if proto plugin list | grep -q "$plugin_name"; then
            echo "✅ Proto recognizes the plugin"
          else
            echo "⚠️ Proto doesn't list the plugin (this might be normal)"
          fi

          # Cleanup
          rm -f ~/.proto/plugins/${plugin_name}.json
          echo "🧹 Cleanup completed"

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [setup, test-plugin]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Plugin Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Plugin:** ${{ needs.setup.outputs.plugin-name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Plugin File:** ${{ inputs.plugin_file }}" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ inputs.specific_version }}" ]; then
            echo "**Version Tested:** ${{ inputs.specific_version }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Version Tested:** Latest" >> $GITHUB_STEP_SUMMARY
          fi

          echo "**Operating Systems:** ${{ inputs.test_os }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.test-plugin.result }}" == "success" ]]; then
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.test-plugin.result }}" == "failure" ]]; then
            echo "❌ **Tests failed.** Check the job logs for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Tests completed with issues.** Check the job logs." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check results
        if: needs.test-plugin.result == 'failure'
        run: |
          echo "Plugin tests failed. Check the individual job results for details."
          exit 1
