# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.24.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - rust@1.82.0
    - node@22.16.0
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  ignore:
    - linters: [ALL]
      paths:
        - node_modules/**
        - .git/**
        - "**/.DS_Store"
        - "**/package-lock.json"
        - "**/bun.lock"
        - "**/deno.lock"
    - linters: [checkov]
      paths:
        - .github/workflows/test-single-plugin.yml
        - .github/workflows/batch-test-plugins.yml
  enabled:
    - biome@1.9.4
    - dotenv-linter@3.3.0
    - markdownlint@0.45.0
    - nixpkgs-fmt@1.3.0
    - osv-scanner@2.0.2
    - shellcheck@0.10.0
    - shfmt@3.6.0
    - actionlint@1.7.7
    - checkov@3.2.435
    - git-diff-check
    - taplo@0.9.3
    - trivy@0.63.0
    - trufflehog@3.88.35
    - yamllint@1.37.1
  disabled:
    - prettier
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
